          </p>

          <div class="education" id="education" aria-label="Education">
            <article>
              <p class="school">Cornell University</p>

              <p class="school">UCLA</p>

            <div class="head">

              <span class="ear ear-right"></span>
              <span class="brow brow-left"></span>

              <span class="eye eye-right"></span>
              <span class="nose"></span>

            <div class="neck"></div>
            <div class="body">
